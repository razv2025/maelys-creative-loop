version: 1
applications:
  - appRoot: app
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Amplify env vars exist only at build time — bake the ones the
            # SSR runtime needs into Next's production env file.
            - echo "GOOGLE_API_KEY=$GOOGLE_API_KEY" >> .env.production
            - echo "ACCESS_CODE=$ACCESS_CODE" >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
